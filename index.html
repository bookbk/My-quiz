<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังข้อสอบกฎหมายภาษี</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-card">
    <!-- หน้าเลือกหมวดหมู่ -->
    <div id="category-screen">
      <h2>📂 เลือกหมวดหมู่ภาษี</h2>
      <div id="category-buttons" class="options-container"></div>
    </div>

    <!-- หน้าทำข้อสอบ -->
    <div id="quiz-screen" style="display: none;">
      <h3 id="category-title" style="color: #64748b; font-size: 14px;"></h3>
      <h2 id="question">กำลังโหลดคำถาม...</h2>
      <div id="options" class="options-container"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" onclick="nextQuestion()" style="display:none;">ข้อถัดไป ➔</button>
      <button onclick="backToCategories()" style="margin-top: 10px; background: none; border: none; color: #64748b; cursor: pointer;">← เปลี่ยนหมวดหมู่</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
